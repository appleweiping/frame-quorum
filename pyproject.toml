[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "frame-quorum"
version = "0.2.0"
description = "Explainable, content-aware key-frame selection for image sequences"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["keyframes", "images", "computer-vision", "contact-sheet", "video-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = ["Pillow>=10.3"]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "hatchling==1.32.0",
  "mypy>=1.15",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=7.0",
]

[project.scripts]
frame-quorum = "frame_quorum.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/frame-quorum#readme"
Issues = "https://github.com/appleweiping/frame-quorum/issues"
Source = "https://github.com/appleweiping/frame-quorum"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_quorum"]

[tool.hatch.build.targets.sdist]
include = [
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/benchmarks",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["frame_quorum"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
# B101: `timestamps.py` asserts `config.timestamp_regex is not None` purely to narrow
# the type for mypy strict. `ScanConfig.__post_init__` already rejects a filename
# timestamp_mode without a regex, so the assert guards an invariant, not a security
# boundary; stripping it under `python -O` yields a TypeError, not a bypass.
# B406: `benchmark.py` imports `xml.sax.saxutils.escape`, which *escapes* text when the
# SVG report is written. It never parses XML, so the XML-entity-expansion attacks this
# blacklist exists for do not apply and defusedxml offers no replacement for it.
# B404/B603: `video.py` invokes FFmpeg with a fixed argv list and never `shell=True`.
# Every element is a literal, a number formatted from a validated VideoExtractionConfig,
# or a resolved Path; the executable name is checked by `_require_safe_text`. No string
# is ever concatenated into a command line for a shell to re-parse.
skips = ["B101", "B404", "B406", "B603"]
