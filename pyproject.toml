[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "frame-quorum"
version = "0.2.0"
description = "Explainable, content-aware key-frame selection for image sequences"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["keyframes", "images", "computer-vision", "contact-sheet", "video-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = ["Pillow>=10.3"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "twine>=7.0"]

[project.scripts]
frame-quorum = "frame_quorum.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/frame-quorum#readme"
Issues = "https://github.com/appleweiping/frame-quorum/issues"
Source = "https://github.com/appleweiping/frame-quorum"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_quorum"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["frame_quorum"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
