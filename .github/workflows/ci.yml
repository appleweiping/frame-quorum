name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m ruff check .
      - run: uv run --frozen --extra dev python -m ruff format --check .
      - run: uv run --frozen --extra dev python -m mypy
      - run: uv run --frozen --extra dev python -m bandit -q -c pyproject.toml -r src
      - run: uv run --frozen --extra dev python -m pytest --cov --cov-report=term-missing
      - run: uv run --frozen --extra dev python -m build --no-isolation

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.quality.result }}
        run: test "${MATRIX_RESULT}" = success
